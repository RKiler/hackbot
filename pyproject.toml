[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bughunter-agent"
version = "0.1.0"
description = "Standalone foundation for evidence-driven security research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
recon = ["psycopg2-binary>=2.9,<3"]
browser = ["playwright>=1.50,<2"]
service = ["Flask>=3.0,<4", "gunicorn>=22,<24"]

[project.scripts]
hackbot = "hackbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackbot = ["migrations/*.sql", "skill_catalog/core/*/*/SKILL.md",
           "skill_catalog/imported/*/SKILL.md", "skill_catalog/personal/*/SKILL.md"]
