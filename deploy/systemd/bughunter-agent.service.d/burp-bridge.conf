[Service]
LoadCredential=burp_bridge:/root/.config/bughunter-agent/burp-bridge.token
ExecStart=
ExecStart=/opt/bughunter/burp/with-bridge-secret.sh /root/bughunter-agent/.venv/bin/gunicorn --workers 1 --threads 1 --worker-class sync --bind unix:/run/bughunter-agent/control.sock --umask 0077 --timeout 120 --graceful-timeout 15 --max-requests 0 hackbot.service:create_app()
